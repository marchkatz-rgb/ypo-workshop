<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YPO Workshop</title>
    <meta name="description" content="Starter site for the YPO Workshop, built with Vite, Supabase, and Vercel." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Starter site</p>
        <h1>YPO Workshop</h1>
        <p class="lede">
          A simple website deployed on Vercel and connected to a Supabase database.
          Sign the guestbook below to see it write and read live data.
        </p>
        <p id="status" class="status status-pending">Checking Supabase connection…</p>
      </header>

      <section class="card">
        <h2>Sign the guestbook</h2>
        <form id="guestbook-form" class="form">
          <label>
            Your name
            <input name="name" type="text" maxlength="60" required placeholder="Ada" />
          </label>
          <label>
            Message
            <textarea name="message" maxlength="280" rows="3" required placeholder="Hello from the workshop!"></textarea>
          </label>
          <button type="submit" id="submit-btn">Post message</button>
          <p id="form-error" class="error" hidden></p>
        </form>
      </section>

      <section class="card">
        <h2>Recent entries</h2>
        <ul id="entries" class="entries">
          <li class="muted">Loading…</li>
        </ul>
      </section>

      <footer class="footer">
        Built with <a href="https://vitejs.dev">Vite</a>, <a href="https://supabase.com">Supabase</a>, and
        <a href="https://vercel.com">Vercel</a>.
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
